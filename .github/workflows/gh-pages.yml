name: github pages

on:
  push:
    branches:
      - main # Set a branch name to trigger deployment

jobs:
  deploy:
    name: Deploy doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Use OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'
          dune-cache: true
          allow-prerelease-opam: true

      - run: opam install odig cephalopod cephalopod-models cephalopod-firehose-client
      - run: opam exec -- odig odoc --cache-dir=_doc/ cephalopod cephalopod-models cephalopod-firehose-client

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_doc/html
          destination_dir: .
          enable_jekyll: false
