[package]
name = "atyolo"
version = "0.1.0"
edition = "2021"

[dependencies]
base32 = "0.5.1"
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
bumpalo = { version = "3.16.0", default-features = false }
ciborium-io = "0.2.2"
ciborium-ll = "0.2.2"
json = { version = "0.12.4", default-features = false }
sha2 = "0.10.8"
thiserror = "2.0.9"

[dev-dependencies]
hex = "0.4.3"
proptest = { version = "1.6.0", default-features = false, features = ["std", "timeout"] }
